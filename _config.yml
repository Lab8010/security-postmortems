title: セキュリティずかん
description: セキュリティ侵害が起きると組織にどんな影響が及ぶかをまとめた早見図鑑と、一般的な対策・国内事例の付録資料。
lang: ja
baseurl: "/security-zukan"
url: "https://lab8010.github.io"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# GitHub Pages 標準プラグイン（Markdown の .md リンクを .html に変換、README.md をフォルダの index にする 等）
plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-titles-from-headings
  - jekyll-default-layout

relative_links:
  enabled: true
  collections: false

titles_from_headings:
  strip_title: false

exclude:
  - CLAUDE.md
  - templates/
  - Gemfile
  - Gemfile.lock
  - vendor/
